name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # scripts/check.sh is the single definition of every gate — see the script's header.
      # No ./.venv here, so its bin() falls back to PATH.
      - name: Run unit tests
        run: scripts/check.sh pytest

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to 22 for the built-in test runner. The syntax gate no longer depends on the
      # version's module-detection behaviour — see check_js_syntax in scripts/check.sh for why
      # it feeds stdin with --input-type=module instead of using `node --check <file>`.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check the frontend and run its unit tests
        run: scripts/check.sh js

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build ./.venv so the [tool.pyright] venv config resolves the same way it does locally.
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      # The script's bin() picks up ./.venv/bin/pyright built above.
      - name: Run pyright
        run: scripts/check.sh types
