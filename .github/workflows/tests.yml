name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to 22: `node --check` treats a .js file as CommonJS and fails on `import` before
      # 22.7's unflagged module-syntax detection.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check the frontend
        run: node --check ui/static/app.js && node --check ui/static/lib.js

      # Glob, not a bare directory: `node --test tests/js/` module-resolves the path and fails.
      - name: Run frontend unit tests
        run: node --test "tests/js/**/*.test.mjs"

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build ./.venv so the [tool.pyright] venv config resolves the same way it does locally.
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Run pyright
        run: .venv/bin/pyright
